[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "revokeai-core"
version = "0.2.0"
description = "Consent-gated context and on-chain memory revocation for AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "web3>=7,<9",
    "eth-account>=0.13",
    "eth-abi>=5",
]

[project.optional-dependencies]
documents = [
    "pymupdf>=1.24",
    "python-docx>=1.1",
]
gemini = [
    "google-genai>=1.0",
]
test = [
    "pytest>=8",
    "eth-tester>=0.12",
    "py-evm>=0.10",
    "py-solc-x>=2",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
revokeai_core = ["abi/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
